name: Pruebas API (Postman + Newman)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y levantar la API
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/biblioteca-api-1.0.0.jar > app.log 2>&1 &

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install

      - name: Ejecutar colecciones
        run: npm test

      - name: Publicar reportes HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-newman
          path: reports/
